<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Склад — онлайн остатки</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,Arial,sans-serif;background:#0b1020;color:#eef2ff}
  .wrap{max-width:1400px;margin:auto;padding:28px;transition:opacity .45s ease}
  header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
  h1{margin:0;font-size:30px}.sub{color:#98a2b3;margin-top:6px}
  .time{color:#98a2b3;font-size:14px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .card{background:#121a2d;border:1px solid #202b44;border-radius:18px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
  .label{color:#98a2b3;font-size:13px;text-transform:uppercase;letter-spacing:.06em}
  .num{font-size:34px;font-weight:700;margin-top:8px}
  .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
  .panel{background:#121a2d;border:1px solid #202b44;border-radius:18px;padding:20px;margin-bottom:18px}
  .panel h2{font-size:18px;margin:0 0 18px}
  .chartbox{height:390px}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  input,select{background:#0d1526;color:#eef2ff;border:1px solid #2a3857;border-radius:10px;padding:11px 13px;outline:none}
  input{min-width:260px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{padding:12px 10px;border-bottom:1px solid #202b44;text-align:left}
  th{color:#98a2b3;font-weight:500}
  .status{font-weight:700}
  .ok{color:#5ee39a}.warn{color:#f5c451}.bad{color:#ff6b6b}
  .critical-list{display:flex;flex-direction:column;gap:10px}
  .critical{display:flex;justify-content:space-between;gap:15px;padding:13px;border-radius:12px;background:#0d1526}
  .muted{color:#98a2b3}
  @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
  @media(max-width:600px){.wrap{padding:16px}.cards{grid-template-columns:1fr 1fr}.num{font-size:26px}input{min-width:100%}header{align-items:flex-start;flex-direction:column}}

  body{overflow-x:hidden}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;
    background:
      linear-gradient(rgba(120,150,200,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,150,200,.08) 1px,transparent 1px);
    background-size:42px 42px;
    animation:gridMove 18s linear infinite;
  }
  @keyframes gridMove{to{background-position:42px 42px}}
  header{animation:fadeDown .7s ease both}
  .card{
    position:relative;overflow:hidden;
    transition:transform .45s ease, border-color .45s ease, box-shadow .45s ease;
  }
  .card::after{
    content:"";position:absolute;left:-30%;top:0;width:40%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    transform:skewX(-20deg);animation:shine 5s ease-in-out infinite;
  }
  .card:hover{transform:translateY(-5px);border-color:#38517e;box-shadow:0 18px 40px rgba(0,0,0,.25)}
  .num{letter-spacing:-.03em;transition:transform .3s ease}
  .panel{animation:fadeUp .8s ease both}
  .panel:nth-child(2){animation-delay:.08s}
  .grid>.panel{animation-delay:.12s}
  tbody tr{transition:background .25s ease,transform .25s ease}
  tbody tr:hover{background:rgba(255,255,255,.035);transform:translateX(3px)}
  .status{transition:filter .25s ease}
  .bad{animation:urgentPulse 2.2s ease-in-out infinite}
  .critical{transition:transform .3s ease,background .3s ease}
  .critical:hover{transform:translateX(5px);background:#111d34}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes shine{0%,65%{left:-40%}100%{left:130%}}
  @keyframes urgentPulse{0%,100%{opacity:1}50%{opacity:.58}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
  }


/* ===== CONTINUOUS DASHBOARD ANIMATION ===== */
body::after{
  content:"";
  position:fixed; inset:-30%;
  pointer-events:none; z-index:-1;
  background:
    radial-gradient(circle at 20% 30%, rgba(65,105,180,.12), transparent 28%),
    radial-gradient(circle at 80% 70%, rgba(70,180,150,.09), transparent 25%);
  animation:ambientDrift 16s ease-in-out infinite alternate;
}
@keyframes ambientDrift{
  0%{transform:translate3d(-2%,-1%,0) scale(1)}
  50%{transform:translate3d(3%,2%,0) scale(1.06)}
  100%{transform:translate3d(-1%,4%,0) scale(1.02)}
}
.panel{
  position:relative;
  overflow:hidden;
}
.panel::before{
  content:"";
  position:absolute;
  top:0; left:-35%;
  width:28%; height:2px;
  background:linear-gradient(90deg,transparent,rgba(100,180,255,.85),transparent);
  animation:scanLine 5s linear infinite;
}
@keyframes scanLine{
  0%{left:-35%}
  100%{left:110%}
}
.chartbox{height:390px;position:relative}
.chartbox canvas{filter:drop-shadow(0 8px 18px rgba(60,130,255,.10))}
.chartbox::after{
  content:"";
  position:absolute; inset:8% 0;
  pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.025),transparent);
  transform:translateX(-110%);
  animation:chartSweep 6s ease-in-out infinite;
}
@keyframes chartSweep{
  0%,35%{transform:translateX(-110%)}
  65%,100%{transform:translateX(110%)}
}
.livePulse{
  animation:livePulse 1.3s ease-in-out infinite!important;
}
@keyframes livePulse{
  0%,100%{transform:scale(1);opacity:.65}
  50%{transform:scale(1.8);opacity:1}
}
.mini-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.mini-chartbox{height:300px}
.kpi-line{
  height:8px;border-radius:99px;background:#0d1526;overflow:hidden;margin-top:12px
}
.kpi-line i{
  display:block;height:100%;width:35%;border-radius:99px;
  background:linear-gradient(90deg,#5ee39a,#70a7ff,#c084fc);
  animation:kpiFlow 3s ease-in-out infinite alternate;
}
@keyframes kpiFlow{from{transform:translateX(-10%);width:28%}to{transform:translateX(5%);width:78%}}
@media(max-width:900px){.mini-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  body::after,.panel::before,.chartbox::after,.kpi-line i{animation:none!important}
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>СКЛАД — ONLINE</h1>
      <div class="sub">Остатки материалов и оборудования</div>
    </div>
    <div class="time"><span id="liveDot" class="livePulse" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#5ee39a;margin-right:7px;box-shadow:0 0 12px rgba(94,227,154,.65)"></span><span id="updated">Обновлено: —</span></div>
  </header>

  <section class="cards">
    <div class="card"><div class="label">Позиций</div><div class="num" id="count">0</div></div>
    <div class="card"><div class="label">Общий остаток</div><div class="num" id="total">0</div></div>
    <div class="card"><div class="label">Заказ срочно</div><div class="num bad" id="urgent">0</div></div>
    <div class="card"><div class="label">Подразделений</div><div class="num" id="departments">0</div></div>
  </section>
  <div class="panel" style="margin-bottom:22px;padding:14px 18px">
    <div class="label">Система мониторинга склада</div>
    <div class="kpi-line"><i></i></div>
  </div>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>Остатки по товарам</h2>
        <div class="filters">
          <input id="search" placeholder="Поиск товара...">
          <select id="dept"><option value="">Все подразделения</option></select>
          <select id="status"><option value="">Все статусы</option><option>Норма</option><option>ЗАКАЗ СРОЧНО</option></select>
        </div>
        <table>
          <thead><tr><th>Товар</th><th>Ед.</th><th>Остаток</th><th>Расход 30 дн.</th><th>Мин.</th><th>Статус</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <div>
      <div class="panel">
        <h2>Остатки — визуально</h2>
        <div class="chartbox"><canvas id="stockChart"></canvas></div>
      </div>
      <div class="panel">
        <h2>Требуют заказа</h2>
        <div class="critical-list" id="critical"></div>
      </div>
      <div class="mini-grid">
        <div class="panel">
          <h2>Расход за 30 дней</h2>
          <div class="mini-chartbox"><canvas id="usageChart"></canvas></div>
        </div>
        <div class="panel">
          <h2>Статус запасов</h2>
          <div class="mini-chartbox"><canvas id="statusChart"></canvas></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSpAsSobUHNwoLt2bES-kpXlaX4nOeg4-t2dwmFY5rs5lo0wZsPGjxsv4HCKFYeN2SSfnV_0LHo0sB7/pub?output=csv";
let DATA = [];
let filtered = [];
let chart;
let usageChart;
let statusChart;

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quoted = false;
  for (let i=0; i<text.length; i++) {
    const c=text[i], n=text[i+1];
    if (c === '"' && quoted && n === '"') { cell += '"'; i++; continue; }
    if (c === '"') { quoted = !quoted; continue; }
    if (c === ',' && !quoted) { row.push(cell.trim()); cell=""; continue; }
    if ((c === '\n' || c === '\r') && !quoted) {
      if (c === '\r' && n === '\n') i++;
      row.push(cell.trim()); cell="";
      if (row.some(v=>v!=="")) rows.push(row);
      row=[]; continue;
    }
    cell += c;
  }
  if (cell || row.length) { row.push(cell.trim()); if (row.some(v=>v!=="")) rows.push(row); }
  return rows;
}

function num(v) {
  if (v === undefined || v === null) return 0;
  return Number(String(v).replace(/\s/g,"").replace(",", ".")) || 0;
}

async function loadData() {
  const url = SHEET_URL + "&t=" + Date.now();
  const response = await fetch(url, {cache:"no-store"});
  if (!response.ok) throw new Error("Google Sheets: " + response.status);
  const text = await response.text();
  const rows = parseCSV(text);
  if (!rows.length) throw new Error("Пустая таблица");

  // Your columns:
  // A Товар | B Ед.Изм. | C Остаток | D Подразделение |
  // E Расход (30 дн) | F Минимальный остаток | G Статус
  const dataRows = rows.slice(1).filter(r => r[0]);
  DATA = dataRows.map(r => [
    r[0],
    r[1] || "",
    num(r[2]),
    r[3] || "",
    num(r[4]),
    num(r[5]),
    r[6] || ""
  ]);
  render();
}

async function refreshData() {
  try {
    document.querySelector('.wrap').style.opacity = '.72';
    await loadData();
    requestAnimationFrame(()=>document.querySelector('.wrap').style.opacity = '1');
  } catch (e) {
    console.error(e);
    document.getElementById('updated').textContent = "Ошибка обновления данных";
  }
}


function animateNumber(el, target) {
  const start = Number(el.dataset.value || 0);
  const end = Number(target) || 0;
  const duration = 900;
  const t0 = performance.now();
  function step(t) {
    const p = Math.min(1, (t-t0)/duration);
    const eased = 1-Math.pow(1-p,3);
    const value = Math.round(start+(end-start)*eased);
    el.textContent = value.toLocaleString('ru-RU');
    if (p<1) requestAnimationFrame(step);
  }
  el.dataset.value = end;
  requestAnimationFrame(step);
}

function render() {
  const q=document.getElementById('search').value.toLowerCase();
  const d=document.getElementById('dept').value;
  const s=document.getElementById('status').value;
  filtered=DATA.filter(x=>(!q||x[0].toLowerCase().includes(q))&&(!d||x[3]===d)&&(!s||x[6]===s));
  animateNumber(document.getElementById('count'), DATA.length);
  animateNumber(document.getElementById('total'), DATA.reduce((a,x)=>a+Number(x[2]),0));
  animateNumber(document.getElementById('urgent'), DATA.filter(x=>x[6]==="ЗАКАЗ СРОЧНО").length);
  animateNumber(document.getElementById('departments'), new Set(DATA.map(x=>x[3])).size);
  document.getElementById('updated').textContent='Обновлено: '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  document.getElementById('rows').innerHTML=filtered.map(x=>{
    const cls=x[6]==="ЗАКАЗ СРОЧНО"?'bad':'ok';
    return `<tr><td>${x[0]}</td><td>${x[1]}</td><td><b>${x[2].toLocaleString('ru-RU')}</b></td><td>${x[4].toLocaleString('ru-RU')}</td><td>${x[5].toLocaleString('ru-RU')}</td><td class="status ${cls}">${x[6]}</td></tr>`;
  }).join('');

  const urgent=DATA.filter(x=>x[6]==="ЗАКАЗ СРОЧНО");
  document.getElementById('critical').innerHTML=urgent.map(x=>`<div class="critical"><span>${x[0]}<br><span class="muted">${x[3]}</span></span><b class="bad">${x[2]} ${x[1]}</b></div>`).join('') || '<span class="muted">Критических позиций нет</span>';

  const top=filtered.slice().sort((a,b)=>b[2]-a[2]).slice(0,8);
  if(chart) chart.destroy();
  if(usageChart) usageChart.destroy();
  if(statusChart) statusChart.destroy();

  const commonAnim = {
    duration: 2200,
    easing: 'easeInOutCubic',
    loop: true
  };

  chart=new Chart(document.getElementById('stockChart'),{
    type:'bar',
    data:{
      labels:top.map(x=>x[0]),
      datasets:[{
        label:'Остаток',
        data:top.map(x=>x[2]),
        borderRadius:8,
        borderWidth:1
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{
        duration:2200,
        easing:'easeInOutSine',
        onProgress:function(animation){
          const p=animation.currentStep/animation.numSteps;
          this.data.datasets.forEach(ds=>{
            ds.backgroundColor=ds.data.map((_,i)=>{
              const v=0.48+0.18*Math.sin((p*2*Math.PI)+i*.55);
              return `rgba(90,150,255,${v})`;
            });
          });
        }
      },
      transitions:{
        active:{animation:{duration:450}},
        resize:{animation:{duration:700}},
        show:{animation:{duration:1400,easing:'easeOutQuart'}},
        hide:{animation:{duration:900}}
      },
      plugins:{
        legend:{display:false},
        tooltip:{displayColors:false,padding:12,backgroundColor:'#0b1020',titleColor:'#eef2ff',bodyColor:'#cbd5e1',borderColor:'#2a3857',borderWidth:1}
      },
      scales:{
        x:{ticks:{color:'#98a2b3',maxRotation:35,minRotation:0},grid:{display:false}},
        y:{beginAtZero:true,ticks:{color:'#98a2b3'},grid:{color:'rgba(152,162,179,.10)'}}
      }
    }
  });

  const usageTop=filtered.slice().sort((a,b)=>b[4]-a[4]).slice(0,8);
  usageChart=new Chart(document.getElementById('usageChart'),{
    type:'line',
    data:{
      labels:usageTop.map(x=>x[0]),
      datasets:[{
        label:'Расход',
        data:usageTop.map(x=>x[4]),
        tension:.42,
        fill:true,
        borderWidth:2,
        pointRadius:4,
        pointHoverRadius:7
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      animation:{duration:2500,easing:'easeInOutSine'},
      plugins:{legend:{display:false},tooltip:{displayColors:false,padding:10,backgroundColor:'#0b1020'}},
      scales:{
        x:{ticks:{color:'#98a2b3',maxRotation:35},grid:{display:false}},
        y:{beginAtZero:true,ticks:{color:'#98a2b3'},grid:{color:'rgba(152,162,179,.10)'}}
      }
    }
  });

  const normal=DATA.filter(x=>x[6]==="Норма").length;
  const urgent=DATA.filter(x=>x[6]==="ЗАКАЗ СРОЧНО").length;
  statusChart=new Chart(document.getElementById('statusChart'),{
    type:'doughnut',
    data:{
      labels:['Норма','Заказ срочно'],
      datasets:[{
        data:[normal,urgent],
        borderWidth:2,
        offset:[0,6]
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      cutout:'68%',
      animation:{duration:2600,easing:'easeInOutCubic'},
      plugins:{
        legend:{position:'bottom',labels:{color:'#cbd5e1',padding:18}},
        tooltip:{padding:10,backgroundColor:'#0b1020'}
      }
    }
  });

}
['search','dept','status'].forEach(id=>document.getElementById(id).addEventListener('input',render));

function updateDepartments() {
  const select = document.getElementById('dept');
  const current = select.value;
  select.innerHTML = '<option value="">Все подразделения</option>';
  [...new Set(DATA.map(x=>x[3]).filter(Boolean))].forEach(x =>
    select.insertAdjacentHTML('beforeend', `<option>${x}</option>`)
  );
  select.value = current;
}

// Wrap render so filters are refreshed when the sheet changes.
const originalRender = render;
render = function() {
  updateDepartments();
  originalRender();
};

refreshData();
setInterval(refreshData, 60000);
</script>
</body>
</html>
